services:
  seanime-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: seanime:dev-air
    container_name: seanime-dev
    restart: unless-stopped
    ports:
      - "43000:43000"
    volumes:
      - .:/src
      - ./.dev-data:/dev-data
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      - TZ=America/Lima

volumes:
  go-mod-cache:
  go-build-cache:
